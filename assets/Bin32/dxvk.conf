# Far Cry DXVK Modernization Configuration
# 1. Seamless cubemap filtering across skybox/reflection faces
d3d9.seamlessCubes = True

# 2. Cap reported VRAM at 1024 MB to prevent signed 32-bit integer overflow
#    in XRenderD3D9.dll (GetAvailableTextureMem() > 2047 MB wraps negative)
d3d9.maxAvailableMemory = 1024
d3d9.memoryTrackTest = True

# 3. Emulate legacy D3D9 IEEE-754 float behavior (0 * INF = 0) so PS2.0/VS2.0
#    specular, water, and bump shaders never produce NaN black/flickering pixels
d3d9.floatEmulation = True

# 4. Low-latency frame pacing & tear-free Vulkan presentation (VRR / high-Hz friendly)
d3d9.maxFrameLatency = 1
d3d9.numBackBuffers = 3
dxgi.tearFree = True
